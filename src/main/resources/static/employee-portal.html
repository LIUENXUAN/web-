<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>营地公园 · 员工端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter",system-ui,sans-serif;background:#0a1511;color:#d0e0d8;min-height:100vh}
.login-page{display:flex;min-height:100vh;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,rgba(61,122,74,0.12),transparent 60%),#0a1511}
.login-card{width:400px;max-width:92vw;padding:40px 36px;background:rgba(8,18,14,0.92);border-radius:20px;border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(12px)}
.login-card h1{font-size:24px;font-weight:700;color:#e0f0e8;margin-bottom:4px}
.login-card .sub{font-size:13px;color:#80a898;margin-bottom:28px}
.login-card .form-group{margin-bottom:18px}
.login-card label{display:block;font-size:12px;color:#90b8a8;margin-bottom:6px;font-weight:500}
.login-card input{width:100%;padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(119,217,239,0.08);border-radius:8px;color:#d0e0d8;font-size:14px;outline:none}
.login-card input:focus{border-color:rgba(74,154,94,0.5)}
.login-card .btn-login{width:100%;padding:12px;border:none;border-radius:8px;background:#3d7a4a;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
.login-card .btn-login:hover{background:#2e6a3a}
.login-card .btn-login:disabled{opacity:.5;cursor:not-allowed}
.login-card .error{color:#e87060;font-size:13px;margin-top:10px;text-align:center}
.app-layout{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:240px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.06);background:rgba(8,18,14,0.92)}
.sidebar-brand{padding:18px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.06)}
.sidebar-brand .mark{width:30px;height:30px;border-radius:8px;background:#6bcf8a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#0a1511}
.sidebar-brand strong{font-size:14px;color:#d0e0d8}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;color:#80a898;font-size:13px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,0.03);color:#c0e0d0}
.nav-item.active{background:rgba(107,207,138,0.1);color:#6bcf8a;font-weight:500}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:10px}
.sidebar-footer .avatar{width:30px;height:30px;border-radius:50%;background:rgba(107,207,138,0.15);display:flex;align-items:center;justify-content:center;font-size:12px;color:#6bcf8a}
.sidebar-footer .info{flex:1;min-width:0}
.sidebar-footer .name{font-size:13px;color:#d0e0d8}
.sidebar-footer .role{font-size:11px;color:#80a898}
.sidebar-footer .logout{background:none;border:none;color:#80a898;cursor:pointer;padding:4px;font-size:16px}
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:rgba(8,18,14,0.5)}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid rgba(255,255,255,0.06)}
.top-bar h2{font-size:17px;font-weight:600;color:#e0f0e8;margin:0}
.page-content{flex:1;overflow-y:auto;padding:24px}
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table th{text-align:left;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.06);color:#80a898;font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.data-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.04);color:#d0e0d8}
.data-table tr:hover td{background:rgba(255,255,255,0.02)}
.status-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:500}
.status-open{background:rgba(74,158,94,0.15);color:#4a9e5e;border:1px solid rgba(74,158,94,0.25)}
.status-closed{background:rgba(212,149,42,0.15);color:#d4952a;border:1px solid rgba(212,149,42,0.25)}
.status-full{background:rgba(232,112,96,0.15);color:#e87060;border:1px solid rgba(232,112,96,0.25)}
.status-done{background:rgba(138,154,138,0.15);color:#8a9a8a;border:1px solid rgba(138,154,138,0.25)}
.level-high{background:rgba(232,112,96,0.15);color:#e87060;border:1px solid rgba(232,112,96,0.25)}
.level-mid{background:rgba(212,149,42,0.15);color:#d4952a;border:1px solid rgba(212,149,42,0.25)}
.level-low{background:rgba(74,158,94,0.15);color:#4a9e5e;border:1px solid rgba(74,158,94,0.25)}
.btn{padding:8px 16px;border-radius:6px;font-size:12px;cursor:pointer;border:none;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:#3d7a4a;color:#fff}.btn-primary:hover{background:#2e6a3a}
.btn-success{background:rgba(74,158,94,0.12);color:#4a9e5e;border:1px solid rgba(74,158,94,0.25)}
.btn-ghost{background:transparent;color:#80a898;border:1px solid rgba(255,255,255,0.08)}
.btn-sm{padding:5px 12px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px;border-radius:4px}
.btn-warning{background:rgba(212,149,42,0.12);color:#d4952a;border:1px solid rgba(212,149,42,0.25)}
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.page-header-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.page-header-bar .count{font-size:12px;color:#80a898}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-box{width:520px;max-width:92vw;max-height:85vh;overflow-y:auto;background:rgba(12,22,18,0.96);border-radius:16px;border:1px solid rgba(255,255,255,0.08);padding:0}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid rgba(255,255,255,0.06)}
.modal-header h3{font-size:16px;font-weight:600;color:#e0f0e8}
.modal-close{background:none;border:none;color:#80a898;font-size:18px;cursor:pointer;padding:4px}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:flex-end;gap:10px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#90b8a8;margin-bottom:6px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;background:rgba(255,255,255,0.04);border:1px solid rgba(119,217,239,0.08);border-radius:8px;color:#d0e0d8;font-size:13px;outline:none;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:rgba(74,154,94,0.5)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.health-bar{display:flex;align-items:center;gap:6px}
.health-bar .bar{width:60px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden}
.health-bar .fill{height:100%;border-radius:3px}
.health-bar .val{font-size:11px;color:#80a898}
.loading{text-align:center;padding:60px 20px;color:#80a898;font-size:14px}
.loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid rgba(107,207,138,0.15);border-top-color:#6bcf8a;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:#80a898;font-size:13px}
.toast{position:fixed;top:20px;right:20px;z-index:99999;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;max-width:360px}
.toast-success{background:rgba(74,158,94,0.2);border:1px solid rgba(74,158,94,0.3);color:#6bcf8a}
.toast-error{background:rgba(232,112,96,0.2);border:1px solid rgba(232,112,96,0.3);color:#e87060}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  var API = "";
  var app = document.getElementById("app");
  if (!app) { document.write("Error: #app not found"); return; }

  function h(tag, attrs) {
    var children = Array.prototype.slice.call(arguments, 2);
    var el = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (k === "className") el.className = attrs[k];
        else if (k === "style" && typeof attrs[k] === "object") { for (var sk in attrs[k]) el.style[sk] = attrs[k][sk]; }
        else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        else if (k === "disabled") el.disabled = !!attrs[k];
        else if (k === "value" || k === "defaultValue") el.value = attrs[k];
        else el.setAttribute(k, attrs[k]);
      }
    }
    for (var i = 0; i < children.length; i++) {
      var c = children[i];
      if (c == null || c === false || c === true) continue;
      if (Array.isArray(c)) { for (var j = 0; j < c.length; j++) { if (c[j] != null) el.appendChild(typeof c[j] === "string" ? document.createTextNode(c[j]) : c[j]); } }
      else el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }

  function toast(msg, type) {
    type = type || "success";
    var t = h("div", { className: "toast toast-" + type }, msg);
    document.body.appendChild(t);
    setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 3000);
  }

  function api(path, opts) {
    opts = opts || {};
    return fetch(API + path, {
      method: opts.method || "GET",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: opts.body || undefined
    }).then(function(r) {
      if (!r.ok) throw new Error("Request failed: " + r.status);
      return r.json();
    }).then(function(j) {
      if (j.code !== 200) throw new Error(j.msg || "Request failed");
      return j.data;
    });
  }

  function statusBadge(s) {
    var cls = "status-badge ";
    if (s === "正常" || s === "已确认" || s === "已完成" || s === "已关闭" || s === "已处理") cls += "status-open";
    else if (s === "待处理" || s === "待执行" || s === "待确认") cls += "status-closed";
    else if (s === "故障" || s === "已取消") cls += "status-full";
    else if (s === "维护中" || s === "进行中") cls += "status-closed";
    else cls += "status-done";
    return h("span", { className: cls }, s || "-");
  }

  function levelBadge(l) {
    var cls = "status-badge ";
    if (l === "高" || l === "紧急") cls += "level-high";
    else if (l === "中") cls += "level-mid";
    else cls += "level-low";
    return h("span", { className: cls }, l || "-");
  }

  function healthBar(v) {
    v = v || 0;
    var color = v >= 80 ? "#4a9e5e" : v >= 50 ? "#d4952a" : "#e87060";
    return h("div", { className: "health-bar" },
      h("div", { className: "bar" }, h("div", { className: "fill", style: { width: v + "%", background: color } })),
      h("span", { className: "val" }, v + "%")
    );
  }

  function fmtDate(d) { if (!d) return "-"; return d.substring(0, 10); }
  function fmtDateTime(d) { if (!d) return "-"; return d.substring(0, 16).replace("T", " "); }

  var state = { user: null, page: "assets" };
  var assetsState = { data: null, modal: null, form: {} };
  var inspState = { data: null, modal: null, form: {}, detail: null };
  var alertState = { data: null, modal: null, form: {}, detail: null };
  function showLogin() {
    app.innerHTML = "";
    app.appendChild(
      h("div", { className: "login-page" },
        h("div", { className: "login-card" },
          h("h1", null, "员工端"),
          h("div", { className: "sub" }, "营地公园管理系统 · 员工入口"),
          h("div", { className: "form-group" },
            h("label", null, "用户名"),
            h("input", { id: "login-user", type: "text", placeholder: "请输入用户名" })
          ),
          h("div", { className: "form-group" },
            h("label", null, "密码"),
            h("input", { id: "login-pass", type: "password", placeholder: "请输入密码" })
          ),
          h("button", { className: "btn-login", id: "login-btn", onClick: doLogin }, "登 录"),
          h("div", { className: "error", id: "login-error" })
        )
      )
    );
    document.getElementById("login-pass").addEventListener("keydown", function(e) {
      if (e.key === "Enter") doLogin();
    });
  }

  function doLogin() {
    var user = document.getElementById("login-user").value.trim();
    var pass = document.getElementById("login-pass").value.trim();
    var btn = document.getElementById("login-btn");
    var err = document.getElementById("login-error");
    if (!user || !pass) { err.textContent = "请输入用户名和密码"; return; }
    btn.disabled = true; btn.textContent = "登录中..."; err.textContent = "";
    api("/api/login", { method: "POST", body: JSON.stringify({ username: user, password: pass }) })
      .then(function(u) { state.user = u; showApp(); })
      .catch(function(e) { err.textContent = "登录失败: " + e.message; btn.disabled = false; btn.textContent = "登 录"; });
  }

  function showApp() {
    app.innerHTML = "";
    var layout = h("div", { className: "app-layout" });
    var sidebar = h("div", { className: "sidebar" });
    sidebar.appendChild(h("div", { className: "sidebar-brand" }, h("div", { className: "mark" }, "E"), h("strong", null, "员工工作台")));
    var nav = h("div", { className: "sidebar-nav" });
    var pages = [
      { id: "assets", icon: "🔧", label: "资产管理" },
      { id: "inspections", icon: "📋", label: "巡检管理" },
      { id: "alerts", icon: "🔔", label: "告警管理" }
    ];
    for (var pi = 0; pi < pages.length; pi++) {
      (function(p) {
        nav.appendChild(h("button", {
          className: "nav-item" + (state.page === p.id ? " active" : ""),
          onClick: function() { state.page = p.id; showPage(); }
        }, h("span", null, p.icon), h("span", null, p.label)));
      })(pages[pi]);
    }
    sidebar.appendChild(nav);
    var sfooter = h("div", { className: "sidebar-footer" });
    sfooter.appendChild(h("div", { className: "avatar" }, (state.user.displayName || state.user.username || "U").charAt(0)));
    sfooter.appendChild(h("div", { className: "info" },
      h("div", { className: "name" }, state.user.displayName || state.user.username || "员工"),
      h("div", { className: "role" }, "员工")
    ));
    sfooter.appendChild(h("button", { className: "logout", onClick: function() {
      api("/api/logout", { method: "POST" }).then(function() { state.user = null; showLogin(); }).catch(function() { state.user = null; showLogin(); });
    } }, "🚪"));
    sidebar.appendChild(sfooter);
    layout.appendChild(sidebar);
    var main = h("div", { className: "main-area" });
    var topBar = h("div", { className: "top-bar" });
    topBar.appendChild(h("h2", { id: "page-title" }, "资产管理"));
    main.appendChild(topBar);
    main.appendChild(h("div", { className: "page-content", id: "page-content" }));
    layout.appendChild(main);
    app.appendChild(layout);
    showPage();
  }

  function showPage() {
    var titleEl = document.getElementById("page-title");
    var titles = { assets: "资产管理", inspections: "巡检管理", alerts: "告警管理" };
    if (titleEl) titleEl.textContent = titles[state.page] || "员工工作台";
    if (state.page === "assets") renderAssets();
    else if (state.page === "inspections") renderInspections();
    else if (state.page === "alerts") renderAlerts();
  }
  function renderAssets() {
    var content = document.getElementById("page-content");
    if (!content) return;
    content.innerHTML = "<div class=\"loading\"><div class=\"spinner\"></div>加载中...</div>";
    api("/api/employee/assets").then(function(data) { assetsState.data = data; renderAssetsContent(content); }).catch(function(err) { content.innerHTML = "<div class=\"empty\">加载失败: " + err.message + "</div>"; });
  }

  function renderAssetsContent(content) {
    var data = assetsState.data || [];
    content.innerHTML = "";
    content.appendChild(h("div", { className: "filter-bar" },
      h("button", { className: "btn btn-primary btn-sm", onClick: function() {
        assetsState.form = { name: "", zone: "", type: "设备", status: "正常", priority: "中", health: 100, owner: "" };
        assetsState.modal = "new"; showAssetsModal();
      } }, "+ 新增资产"),
      h("button", { className: "btn btn-ghost btn-sm", onClick: function() { renderAssets(); } }, "🔄 刷新")
    ));
    content.appendChild(h("div", { className: "page-header-bar" }, h("span", { className: "count" }, "共 " + data.length + " 项资产")));
    if (data.length === 0) { content.appendChild(h("div", { className: "empty" }, "暂无资产数据")); return; }
    var table = h("table", { className: "data-table" });
    table.appendChild(h("thead", null, h("tr", null, h("th", null, "名称"), h("th", null, "区域"), h("th", null, "类型"), h("th", null, "优先级"), h("th", null, "健康度"), h("th", null, "状态"), h("th", null, "操作"))));
    var tbody = h("tbody");
    for (var i = 0; i < data.length; i++) {
      (function(a) {
        tbody.appendChild(h("tr", null,
          h("td", null, a.name || "-"), h("td", null, a.zone || "-"), h("td", null, a.type || "-"),
          h("td", null, levelBadge(a.priority)), h("td", null, healthBar(a.health || 0)), h("td", null, statusBadge(a.status)),
          h("td", { style: { whiteSpace: "nowrap" } },
            h("button", { className: "btn btn-xs", style: { background: "rgba(107,143,94,0.2)", color: "#6b8f5e", border: "1px solid rgba(107,143,94,0.3)", marginRight: 4 }, onClick: function() { assetsState.form = { name: a.name, zone: a.zone, type: a.type, status: a.status, priority: a.priority, health: a.health, owner: a.owner, id: a.id }; assetsState.modal = "edit"; showAssetsModal(); } }, "编辑"),
            a.status === "正常" ? h("button", { className: "btn btn-xs btn-warning", style: { marginRight: 4 }, onClick: function() { updateAsset(a.id, "故障", a.health); } }, "报故障") : h("button", { className: "btn btn-xs btn-success", style: { marginRight: 4 }, onClick: function() { updateAsset(a.id, "正常", a.health); } }, "恢复")
          )
        ));
      })(data[i]);
    }
    table.appendChild(tbody);
    content.appendChild(table);
  }

  function updateAsset(id, status, health) {
    api("/api/employee/assets/" + id + "/status", { method: "PUT", body: JSON.stringify({ status: status, health: health }) })
      .then(function() { toast("状态已更新"); renderAssets(); })
      .catch(function(err) { toast(err.message, "error"); });
  }

  function showAssetsModal() {
    var existing = document.getElementById("assets-modal");
    if (existing) existing.remove();
    var form = assetsState.form;
    var isNew = assetsState.modal === "new";
    var overlay = h("div", { className: "modal-overlay", id: "assets-modal", onClick: function() { assetsState.modal = null; overlay.remove(); } });
    var box = h("div", { className: "modal-box", onClick: function(e) { e.stopPropagation(); } });
    box.appendChild(h("div", { className: "modal-header" }, h("h3", null, isNew ? "新增资产" : "编辑资产"), h("button", { className: "modal-close", onClick: function() { assetsState.modal = null; overlay.remove(); } }, "✕")));
    var body = h("div", { className: "modal-body" });
    body.appendChild(h("div", { className: "form-group" }, h("label", null, "名称"), h("input", { id: "af-name", value: form.name || "", placeholder: "资产名称" })));
    body.appendChild(h("div", { className: "form-row" },
      h("div", { className: "form-group" }, h("label", null, "所属区域"), h("input", { id: "af-zone", value: form.zone || "", placeholder: "如: 星空营地" })),
      h("div", { className: "form-group" }, h("label", null, "类型"), h("select", { id: "af-type" }, h("option", { value: "设备" }, "设备"), h("option", { value: "设施" }, "设施"), h("option", { value: "车辆" }, "车辆"), h("option", { value: "工具" }, "工具")))
    ));
    body.appendChild(h("div", { className: "form-row" },
      h("div", { className: "form-group" }, h("label", null, "优先级"), h("select", { id: "af-priority" }, h("option", { value: "高" }, "高"), h("option", { value: "中" }, "中"), h("option", { value: "低" }, "低"))),
      h("div", { className: "form-group" }, h("label", null, "健康度 (0-100)"), h("input", { id: "af-health", type: "number", min: 0, max: 100, value: form.health || 100 }))
    ));
    body.appendChild(h("div", { className: "form-row" },
      h("div", { className: "form-group" }, h("label", null, "负责人"), h("input", { id: "af-owner", value: form.owner || "", placeholder: "负责人姓名" })),
      h("div", { className: "form-group" }, h("label", null, "状态"), h("select", { id: "af-status" }, h("option", { value: "正常" }, "正常"), h("option", { value: "维护中" }, "维护中"), h("option", { value: "故障" }, "故障")))
    ));
    box.appendChild(body);
    var footer = h("div", { className: "modal-footer" });
