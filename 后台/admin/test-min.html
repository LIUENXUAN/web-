<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8" /><title>Test</title>
<link rel="stylesheet" href="assets/bloomAdmin-BUhvVHef.css" />
<style>body{margin:0;background:#0a0e17;color:#e8edf5;font-family:sans-serif;padding:40px}</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-router-dom@6/umd/react-router-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
var h = React.createElement;
var Router = ReactRouterDOM.BrowserRouter;
var Routes = ReactRouterDOM.Routes;
var Route = ReactRouterDOM.Route;

function Home() { return h('div', null, h('h1', null, '✅ 基础设施正常'), h('p', null, 'React: ' + typeof React), h('p', null, 'Router: ' + typeof ReactRouterDOM), h('p', null, 'Chart: ' + typeof Chart)); }

function App() {
  return h(Router, null, h(Routes, null, h(Route, { path: '/*', element: h(Home) })));
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
