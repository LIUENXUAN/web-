<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>营地公园 · 员工端</title>
<style>
/* ============================================================
   CampOS 员工门户 · Dark Premium Overhaul
   OLED dark + green accent + glassmorphism + micro-interactions
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

:root {
  --bg-deep: #030806;
  --bg-surface: #070f0b;
  --bg-elevated: #0b1812;
  --bg-card: rgba(11, 24, 18, 0.92);
  --bg-glass: rgba(11, 24, 18, 0.75);
  --bg-hover: rgba(107, 207, 138, 0.06);
  --bg-active: rgba(107, 207, 138, 0.10);
  --accent: #6bcf8a;
  --accent-dim: rgba(107, 207, 138, 0.12);
  --accent-glow: rgba(107, 207, 138, 0.25);
  --text: #e0f0e8;
  --text-secondary: #90b8a8;
  --text-muted: #5a7a6a;
  --danger: #e87060;
  --warning: #d4952a;
  --success: #4a9e5e;
  --radius: 10px;
  --radius-lg: 18px;
  --radius-xl: 24px;
  --shadow: 0 4px 24px rgba(0,0,0,0.5);
  --shadow-lg: 0 8px 48px rgba(0,0,0,0.6);
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* === AMBIENT GLOW BG === */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(ellipse 60% 35% at 50% 0%, rgba(61, 122, 74, 0.10), transparent 70%),
    radial-gradient(ellipse 25% 25% at 80% 90%, rgba(107, 207, 138, 0.05), transparent 60%),
    radial-gradient(ellipse 20% 20% at 20% 70%, rgba(61, 122, 74, 0.04), transparent 50%);
  pointer-events: none;
}

/* ===== LOGIN PAGE ===== */
.login-page {
  display: flex;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse 120% 35% at 50% 10%, rgba(61, 122, 74, 0.15), transparent 60%),
    radial-gradient(ellipse 50% 50% at 85% 85%, rgba(107, 207, 138, 0.06), transparent 50%),
    var(--bg-deep);
}

.login-card {
  width: 420px;
  max-width: 92vw;
  padding: 52px 44px;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  border: 1px solid rgba(107, 207, 138, 0.06);
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(107, 207, 138, 0.06);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.login-card h1 {
  font-size: 30px;
  font-weight: 700;
  margin-bottom: 4px;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #e0f0e8 30%, #6bcf8a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.login-card .sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 40px;
  letter-spacing: 0.02em;
}

.login-card .form-group { margin-bottom: 22px; }

.login-card label {
  display: block;
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 7px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.login-card input {
  width: 100%;
  padding: 13px 16px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(107, 207, 138, 0.06);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: all 200ms var(--ease);
}

.login-card input:focus {
  border-color: rgba(107, 207, 138, 0.25);
  box-shadow: 0 0 0 4px rgba(107, 207, 138, 0.06);
}

.login-card input::placeholder { color: var(--text-muted); }

.login-card .btn-login {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: var(--radius);
  background: linear-gradient(135deg, #3d7a4a 0%, #2e8a4a 100%);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 16px;
  letter-spacing: 0.04em;
  transition: all 200ms var(--ease);
}

.login-card .btn-login:hover {
  background: linear-gradient(135deg, #4a8a5a 0%, #3a9a5a 100%);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(107, 207, 138, 0.25);
}

.login-card .btn-login:active { transform: translateY(0); box-shadow: none; }
.login-card .btn-login:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
.login-card .error { color: var(--danger); font-size: 13px; margin-top: 16px; text-align: center; }

/* ===== APP LAYOUT ===== */
.app-layout {
  display: flex;
  height: 100dvh;
  overflow: hidden;
}

/* ===== SIDEBAR ===== */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg-glass);
  border-right: 1px solid rgba(107, 207, 138, 0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: relative;
}

.sidebar-brand {
  padding: 24px 22px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid rgba(107, 207, 138, 0.04);
}

.sidebar-brand .mark {
  width: 36px;
  height: 36px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, #6bcf8a 0%, #3a9a5a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 17px;
  color: #030806;
  box-shadow: 0 2px 12px rgba(107, 207, 138, 0.3);
}

.sidebar-brand strong {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.02em;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 16px 10px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 400;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  border-radius: var(--radius);
  position: relative;
  transition: all 180ms var(--ease);
  margin-bottom: 2px;
}

.nav-item:hover {
  background: var(--bg-hover);
  color: var(--text);
}

.nav-item.active {
  background: var(--bg-active);
  color: var(--accent);
  font-weight: 500;
}

.nav-item.active::before {
  content: '';
  position: absolute;
  left: -10px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  background: var(--accent);
  border-radius: 0 3px 3px 0;
  box-shadow: 0 0 10px rgba(107, 207, 138, 0.5);
}

.sidebar-footer {
  padding: 18px 18px;
  border-top: 1px solid rgba(107, 207, 138, 0.04);
  display: flex;
  align-items: center;
  gap: 12px;
}

.sidebar-footer .avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, rgba(107, 207, 138, 0.2), rgba(107, 207, 138, 0.05));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  color: var(--accent);
  font-weight: 600;
  flex-shrink: 0;
}

.sidebar-footer .info { flex: 1; min-width: 0; }
.sidebar-footer .name { font-size: 13px; color: var(--text); font-weight: 500; }
.sidebar-footer .role { font-size: 11px; color: var(--text-muted); }

.sidebar-footer .logout {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 6px 8px;
  font-size: 16px;
  border-radius: 8px;
  transition: all 180ms var(--ease);
}

.sidebar-footer .logout:hover {
  color: var(--danger);
  background: rgba(232, 112, 96, 0.08);
}

/* ===== MAIN AREA ===== */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg-surface);
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 36px;
  border-bottom: 1px solid rgba(107, 207, 138, 0.04);
  background: rgba(7, 15, 11, 0.7);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.top-bar h2 {
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  margin: 0;
  letter-spacing: -0.02em;
}

.page-content {
  flex: 1;
  overflow-y: auto;
  padding: 36px;
}

/* ===== DATA TABLE ===== */
.data-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  border: 1px solid rgba(107, 207, 138, 0.04);
  overflow: hidden;
}

.data-table thead { position: sticky; top: 0; z-index: 2; }

.data-table th {
  text-align: left;
  padding: 16px 18px;
  border-bottom: 1px solid rgba(107, 207, 138, 0.06);
  color: var(--text-muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 600;
  background: rgba(7, 15, 11, 0.9);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}

.data-table td {
  padding: 16px 18px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.02);
  color: var(--text);
  font-size: 13px;
}

.data-table tbody tr { transition: background 150ms var(--ease); }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover td { background: var(--bg-hover); }
.data-table tbody tr:nth-child(even) td { background: rgba(255, 255, 255, 0.01); }
.data-table tbody tr:nth-child(even):hover td { background: rgba(107, 207, 138, 0.06); }

/* ===== BADGES ===== */
.status-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.status-open { background: rgba(74, 158, 94, 0.08); color: #4a9e5e; border: 1px solid rgba(74, 158, 94, 0.12); }
.status-closed { background: rgba(212, 149, 42, 0.08); color: #d4952a; border: 1px solid rgba(212, 149, 42, 0.12); }
.status-full { background: rgba(232, 112, 96, 0.08); color: #e87060; border: 1px solid rgba(232, 112, 96, 0.12); }
.status-done { background: rgba(138, 154, 138, 0.08); color: #8a9a8a; border: 1px solid rgba(138, 154, 138, 0.12); }
.level-high { background: rgba(232, 112, 96, 0.08); color: #e87060; border: 1px solid rgba(232, 112, 96, 0.12); }
.level-mid { background: rgba(212, 149, 42, 0.08); color: #d4952a; border: 1px solid rgba(212, 149, 42, 0.12); }
.level-low { background: rgba(74, 158, 94, 0.08); color: #4a9e5e; border: 1px solid rgba(74, 158, 94, 0.12); }

/* ===== BUTTONS ===== */
.btn {
  padding: 9px 20px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  border: none;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 180ms var(--ease);
}

.btn:active { transform: scale(0.95); }

.btn-primary {
  background: linear-gradient(135deg, #3d7a4a 0%, #2e8a4a 100%);
  color: #fff;
}

.btn-primary:hover {
  background: linear-gradient(135deg, #4a8a5a 0%, #3a9a5a 100%);
  box-shadow: 0 4px 16px rgba(107, 207, 138, 0.25);
  transform: translateY(-1px);
}

.btn-success { background: rgba(74, 158, 94, 0.08); color: var(--success); border: 1px solid rgba(74, 158, 94, 0.12); }
.btn-success:hover { background: rgba(74, 158, 94, 0.16); }

.btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid rgba(255, 255, 255, 0.04); }
.btn-ghost:hover { background: rgba(255, 255, 255, 0.03); color: var(--text); }

.btn-sm { padding: 6px 14px; font-size: 11px; }
.btn-xs { padding: 4px 10px; font-size: 10px; border-radius: 6px; }

.btn-warning { background: rgba(212, 149, 42, 0.08); color: var(--warning); border: 1px solid rgba(212, 149, 42, 0.12); }
.btn-warning:hover { background: rgba(212, 149, 42, 0.16); }

/* ===== FILTER BAR ===== */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

/* ===== PAGE HEADER ===== */
.page-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.page-header-bar .count { font-size: 12px; color: var(--text-muted); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.75);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: fadeIn 200ms ease-out;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-box {
  width: 540px;
  max-width: 92vw;
  max-height: 85vh;
  overflow-y: auto;
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  border: 1px solid rgba(107, 207, 138, 0.06);
  box-shadow: var(--shadow-lg);
  padding: 0;
  animation: modalIn 300ms var(--ease);
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 30px 20px;
  border-bottom: 1px solid rgba(107, 207, 138, 0.04);
}

.modal-header h3 { font-size: 18px; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }

.modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: all 180ms var(--ease);
}

.modal-close:hover { background: rgba(232, 112, 96, 0.1); color: var(--danger); }

.modal-body { padding: 24px 30px; }

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 20px 30px 24px;
  border-top: 1px solid rgba(107, 207, 138, 0.04);
}

/* ===== FORMS ===== */
.form-group { margin-bottom: 18px; }

.form-group label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 7px;
  font-weight: 500;
  letter-spacing: 0.03em;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 11px 14px;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(107, 207, 138, 0.06);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  outline: none;
  font-family: inherit;
  transition: all 200ms var(--ease);
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: rgba(107, 207, 138, 0.25);
  box-shadow: 0 0 0 4px rgba(107, 207, 138, 0.05);
}

.form-group input::placeholder,
.form-group textarea::placeholder { color: var(--text-muted); }

.form-group textarea { resize: vertical; min-height: 80px; }

.form-row { display: flex; gap: 14px; }
.form-row .form-group { flex: 1; }

/* ===== HEALTH BAR ===== */
.health-bar { display: flex; align-items: center; gap: 8px; }

.health-bar .bar {
  width: 68px;
  height: 6px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 3px;
  overflow: hidden;
}

.health-bar .fill {
  height: 100%;
  border-radius: 3px;
  transition: width 600ms var(--ease);
}

.health-bar .val { font-size: 11px; color: var(--text-muted); font-weight: 500; }

/* ===== LOADING ===== */
.loading {
  text-align: center;
  padding: 100px 20px;
  color: var(--text-muted);
  font-size: 14px;
}

.loading .spinner {
  display: inline-block;
  width: 40px;
  height: 40px;
  border: 3px solid rgba(107, 207, 138, 0.06);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-bottom: 16px;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ===== EMPTY ===== */
.empty { text-align: center; padding: 60px; color: var(--text-muted); font-size: 13px; }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  top: 28px;
  right: 28px;
  z-index: 99999;
  padding: 14px 24px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  max-width: 380px;
  animation: toastIn 300ms var(--ease);
  box-shadow: var(--shadow);
}

@keyframes toastIn {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}

.toast-success { background: rgba(74, 158, 94, 0.12); border: 1px solid rgba(74, 158, 94, 0.2); color: var(--accent); }
.toast-error { background: rgba(232, 112, 96, 0.12); border: 1px solid rgba(232, 112, 96, 0.2); color: var(--danger); }

/* ===== SCROLLBAR ===== */
.page-content::-webkit-scrollbar { width: 4px; }
.page-content::-webkit-scrollbar-track { background: transparent; }
.page-content::-webkit-scrollbar-thumb { background: rgba(107, 207, 138, 0.06); border-radius: 2px; }
.page-content::-webkit-scrollbar-thumb:hover { background: rgba(107, 207, 138, 0.12); }

/* ===== MISC ===== */
::selection { background: rgba(107, 207, 138, 0.2); color: var(--text); }
:focus-visible { outline: 2px solid rgba(107, 207, 138, 0.35); outline-offset: 2px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .sidebar { width: 200px; }
  .page-content { padding: 20px; }
  .top-bar { padding: 14px 20px; }
  .data-table { font-size: 12px; }
  .data-table th, .data-table td { padding: 12px 14px; }
}
</style>

</head>
<body>
<div id="app"></div>
<script>
(function(){
  var API = "";
    var savedUser = sessionStorage.getItem("emp_user");
    if (savedUser) { try { state.user = JSON.parse(savedUser); } catch(e) {} }
  var app = document.getElementById("app");
  if (!app) { document.write("Error: #app not found"); return; }

  function h(tag, attrs) {
    var children = Array.prototype.slice.call(arguments, 2);
    var el = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        if (k === "className") el.className = attrs[k];
        else if (k === "style" && typeof attrs[k] === "object") { for (var sk in attrs[k]) el.style[sk] = attrs[k][sk]; }
        else if (k.indexOf("on") === 0) el.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
        else if (k === "disabled") el.disabled = !!attrs[k];
        else if (k === "value" || k === "defaultValue") el.value = attrs[k];
        else el.setAttribute(k, attrs[k]);
      }
    }
    for (var i = 0; i < children.length; i++) {
      var c = children[i];
      if (c == null || c === false || c === true) continue;
      if (Array.isArray(c)) { for (var j = 0; j < c.length; j++) { if (c[j] != null) el.appendChild(typeof c[j] === "string" ? document.createTextNode(c[j]) : c[j]); } }
      else el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }

  function toast(msg, type) {
    type = type || "success";
    var t = h("div", { className: "toast toast-" + type }, msg);
    document.body.appendChild(t);
    setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 3000);
  }

  function api(path, opts) {
    opts = opts || {};
    return fetch(API + path, {
      method: opts.method || "GET",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: opts.body || undefined
    }).then(function(r) {
      if (!r.ok) throw new Error("Request failed: " + r.status);
      return r.json();
    }).then(function(j) {
      if (j.code !== 200) throw new Error(j.msg || "Request failed");
      return j.data;
    });
  }

  function statusBadge(s) {
    var cls = "status-badge ";
    if (s === "正常" || s === "已确认" || s === "已完成" || s === "已关闭" || s === "已处理") cls += "status-open";
    else if (s === "待处理" || s === "待执行" || s === "待确认") cls += "status-closed";
    else if (s === "故障" || s === "已取消") cls += "status-full";
    else if (s === "维护中" || s === "进行中") cls += "status-closed";
    else cls += "status-done";
    return h("span", { className: cls }, s || "-");
  }

  function levelBadge(l) {
    var cls = "status-badge ";
    if (l === "高" || l === "紧急") cls += "level-high";
    else if (l === "中") cls += "level-mid";
    else cls += "level-low";
    return h("span", { className: cls }, l || "-");
  }

            h("button", { className: "btn btn-xs", style: { background: "rgba(107,143,94,0.2)", color: "#6b8f5e", border: "1px solid rgba(107,143,94,0.3)" }, onClick: function() { alertState.form = { title: a.title, zone: a.zone, type: a.type, level: a.level, owner: a.owner, id: a.id }; alertState.modal = "edit"; showAlertModal(); } }, "编辑")

    }
    table.appendChild(tbody);
    content.appendChild(table);
  }

  function showAlertModal() {
    var existing = document.getElementById("alert-modal");
    if (existing) existing.remove();
    var form = alertState.form;
    var isNew = alertState.modal === "new";
    var overlay = h("div", { className: "modal-overlay", id: "alert-modal", onClick: function() { alertState.modal = null; overlay.remove(); } });
    var box = h("div", { className: "modal-box", onClick: function(e) { e.stopPropagation(); } });
    box.appendChild(h("div", { className: "modal-header" }, h("h3", null, isNew ? "新增告警" : "编辑告警"), h("button", { className: "modal-close", onClick: function() { alertState.modal = null; overlay.remove(); } }, "✕")));
    var body = h("div", { className: "modal-body" });
    body.appendChild(h("div", { className: "form-group" }, h("label", null, "告警标题"), h("input", { id: "alf-title", value: form.title || "", placeholder: "告警标题" })));
    body.appendChild(h("div", { className: "form-row" },
      h("div", { className: "form-group" }, h("label", null, "区域"), h("input", { id: "alf-zone", value: form.zone || "", placeholder: "如: 星空营地" })),
      h("div", { className: "form-group" }, h("label", null, "类型"), h("select", { id: "alf-type" }, h("option", { value: "设备" }, "设备"), h("option", { value: "安全" }, "安全"), h("option", { value: "环境" }, "环境"), h("option", { value: "其他" }, "其他")))
    ));
    body.appendChild(h("div", { className: "form-row" },
      h("div", { className: "form-group" }, h("label", null, "级别"), h("select", { id: "alf-level" }, h("option", { value: "高" }, "高"), h("option", { value: "中" }, "中"), h("option", { value: "低" }, "低"))),
      h("div", { className: "form-group" }, h("label", null, "负责人"), h("input", { id: "alf-owner", value: form.owner || "", placeholder: "负责人" }))
    ));
    box.appendChild(body);
    var footer = h("div", { className: "modal-footer" });
    footer.appendChild(h("button", { className: "btn btn-ghost", onClick: function() { alertState.modal = null; overlay.remove(); } }, "取消"));
    footer.appendChild(h("button", { className: "btn btn-primary", onClick: function() { saveAlert(); } }, isNew ? "创建" : "保存"));
    box.appendChild(footer);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }

  function saveAlert() {
    var isNew = alertState.modal === "new";
    var form = {
      title: document.getElementById("alf-title").value.trim(),
      zone: document.getElementById("alf-zone").value.trim(),
      type: document.getElementById("alf-type").value,
      level: document.getElementById("alf-level").value,
      owner: document.getElementById("alf-owner").value.trim()
    };
    if (!form.title) { toast("请输入告警标题", "error"); return; }
    var url = isNew ? "/api/employee/alerts" : "/api/employee/alerts/" + alertState.form.id + "/status";
    api(url, { method: isNew ? "POST" : "PUT", body: JSON.stringify(form) }).then(function() {
      toast(isNew ? "告警已创建" : "告警已更新");
      alertState.modal = null;
      var overlay = document.getElementById("alert-modal");
      if (overlay) overlay.remove();
      renderAlerts();
    }).catch(function(err) { toast(err.message, "error"); });
  }

  function showAlertHandleModal() {
    var existing = document.getElementById("alert-handle-modal");
    if (existing) existing.remove();
    var d = alertState.detail;
    var overlay = h("div", { className: "modal-overlay", id: "alert-handle-modal", onClick: function() { alertState.detail = null; overlay.remove(); } });
    var box = h("div", { className: "modal-box", onClick: function(e) { e.stopPropagation(); } });
    box.appendChild(h("div", { className: "modal-header" }, h("h3", null, "处理告警"), h("button", { className: "modal-close", onClick: function() { alertState.detail = null; overlay.remove(); } }, "✕")));
    var body = h("div", { className: "modal-body" });
    var fields = [["title","标题"],["zone","区域"],["level","级别"],["type","类型"],["status","状态"],["createdAt","时间"],["owner","负责人"]];
    for (var fi = 0; fi < fields.length; fi++) {
      var k = fields[fi][0], label = fields[fi][1];
      var val = k === "status" ? statusBadge(d[k]) : k === "level" ? levelBadge(d[k]) : k === "createdAt" ? fmtDateTime(d[k]) : (d[k] || "-");
      body.appendChild(h("div", { className: "form-group" }, h("label", null, label), h("div", { style: { padding: "9px 12px", background: "rgba(255,255,255,0.03)", borderRadius: 8, fontSize: 13, color: "#c0e0d0" } }, val)));
    }
    body.appendChild(h("div", { className: "form-group" }, h("label", null, "分配负责人"), h("input", { id: "alert-owner-input", defaultValue: d.owner || "", placeholder: "输入负责人姓名" })));
    box.appendChild(body);
    var footer = h("div", { className: "modal-footer" });
    footer.appendChild(h("button", { className: "btn btn-ghost", onClick: function() { alertState.detail = null; overlay.remove(); } }, "关闭"));
    footer.appendChild(h("button", { className: "btn btn-primary", onClick: function() {
      var owner = document.getElementById("alert-owner-input").value.trim();
      if (owner) {
        api("/api/employee/alerts/" + d.id + "/status", { method: "PUT", body: JSON.stringify({ owner: owner }) }).then(function() { toast("负责人已更新"); renderAlerts(); }).catch(function(err) { toast(err.message, "error"); });
      }
      alertState.detail = null; overlay.remove();
    } }, "分配负责人"));
    if (d.status === "待处理") {
      footer.appendChild(h("button", { className: "btn btn-success", onClick: function() {
        api("/api/employee/alerts/" + d.id + "/status", { method: "PUT", body: JSON.stringify({ status: "已关闭" }) }).then(function() { toast("告警已关闭"); alertState.detail = null; overlay.remove(); renderAlerts(); }).catch(function(err) { toast(err.message, "error"); });
      } }, "关闭告警"));
    }
    box.appendChild(footer);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }

  if (state.user) { showApp(); } else { showLogin(); }
})();
</script>
